<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda DEAME</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      color: #00ffff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .card {
      background: #1a1a1a;
      border: 2px solid #00ffff44;
      border-radius: 10px;
      padding: 1rem;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: scale(1.03);
      border-color: #00ffff;
    }
    .card h2 {
      margin-top: 0;
      color: #00ffff;
    }
    .card pre {
      background: #111;
      padding: 0.5rem;
      border-radius: 5px;
      font-size: 0.85em;
      overflow-x: auto;
    }
    .card button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #00ffff;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .card button:hover {
      background: #00cccc;
    }
  </style>
</head>
<body>
  <h1>🛍️ Tienda de Extensiones DEAME</h1>
  <div class="grid" id="contenedor"></div>

  <script>
    const contenedor = document.getElementById("contenedor");

    async function cargarTienda() {
      const indexUrl = "index.json"; // o URL completa si está en otro dominio
      const lista = await fetch(indexUrl).then(r => r.json());

      for (const item of lista) {
        const datos = await fetch(item.url).then(r => r.json());

        const card = document.createElement("div");
        card.className = "card";

        const titulo = document.createElement("h2");
        titulo.textContent = datos.nombre;

        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(datos, null, 2);

        const boton = document.createElement("button");
        boton.textContent = "Instalar";
        boton.onclick = () => {
          // Llama a tu navegador DEAME usando un esquema personalizado
          window.location.href = `deame://instalar?url=${encodeURIComponent(item.url)}`;
        };

        card.appendChild(titulo);
        card.appendChild(pre);
        card.appendChild(boton);
        contenedor.appendChild(card);
      }
    }

    cargarTienda();
  </script>
</body>
</html>
