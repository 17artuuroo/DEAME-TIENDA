<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda DEAME</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      color: #00ffff;
    }
    .boton {
      display: inline-block;
      margin: 1rem;
      padding: 1rem 2rem;
      border: none;
      border-radius: 10px;
      font-size: 1.2em;
      font-weight: bold;
      cursor: pointer;
      color: #000;
      transition: transform 0.2s ease;
    }
    .boton:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>🎨 Tienda de Temas DEAME</h1>
  <div id="botones"></div>

  <script>
    const temas = [
      {
        nombre: "Neón",
        color: "#00ffff",
        url: "https://TUUSUARIO.github.io/DEAME-Tienda/neon/neon.json"
      },
      {
        nombre: "Retro",
        color: "#ff00ff",
        url: "https://TUUSUARIO.github.io/DEAME-Tienda/retro/retro.json"
      },
      {
        nombre: "Minimal",
        color: "#ffffff",
        url: "https://TUUSUARIO.github.io/DEAME-Tienda/minimal/minimal.json"
      }
    ];

    const contenedor = document.getElementById("botones");

    temas.forEach(tema => {
      const btn = document.createElement("button");
      btn.className = "boton";
      btn.style.backgroundColor = tema.color;
      btn.textContent = `Descargar ${tema.nombre}`;
      btn.onclick = () => {
        // Llama al navegador DEAME con esquema personalizado
        window.location.href = `deame://instalar?url=${encodeURIComponent(tema.url)}`;
      };
      contenedor.appendChild(btn);
    });
  </script>
</body>
</html>
